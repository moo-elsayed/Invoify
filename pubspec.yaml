name: invoify
description: "Invoify - Automated invoicing and payment tracking mobile application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Styling
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.0
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  gap: ^3.0.1
  toastification: ^3.2.0
  skeletonizer: ^2.1.3

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Local Services & Preferences
  shared_preferences: ^2.5.5

  # Localization
  easy_localization: ^3.0.8

  # Utilities & Logging
  logger: ^2.7.0
  smooth_page_indicator: ^2.0.1
  lottie: ^3.5.1
  get_it: ^9.2.1
  animate_do: ^5.1.0
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^22.2.0
  rename: ^3.1.0
  envied: ^1.3.8
  flutter_native_splash: ^2.4.8
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  bloc_test: ^10.0.0
  fake_cloud_firestore: ^4.2.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  envied_generator: ^1.3.8
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svgs/
    - assets/svgs/icons/
    - assets/translations/
    - assets/jsons/

# Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app-icon.jpg"


# Native Splash Screen Configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app-icon.jpg
  color_dark: "#0F172A"
  image_dark: assets/images/app-icon.jpg

  android_12:
    image: assets/images/splash_ios_android_12.png
    icon_background_color: "#FFFFFF"
    image_dark: assets/images/splash_android_12_dark.png
    icon_background_color_dark: "#0F172A"
